[package]
name = "ssh-desktop"
version = "2.4.0"
description = "SSH Desktop - Remote Linux Administration Interface"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
notify = "6"
walkdir = "2"
zip = "2"
flate2 = "1.0"
russh = "0.46"
russh-keys = "0.46"
russh-sftp = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
parking_lot = "0.12"
directories = "5"
lazy_static = "1.5"
url = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql", "postgres", "sqlite", "chrono", "uuid", "json"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "tokio", "rustls"] }
redis = { version = "0.27", features = ["tokio-comp"] }
mongodb = { version = "2.8", features = ["tokio-runtime"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
sha2 = "0.10"
