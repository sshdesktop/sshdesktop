<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- macOS-style Squircle Canvas -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="4.5"/>
  <rect x="38" y="38" width="436" height="436" rx="98" ry="98" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Subtle glow beneath monitor stand -->
  <ellipse cx="256" cy="414" rx="110" ry="10" fill="#38BDF8" fill-opacity="0.18" filter="url(#glow)"/>

  <!-- Monitor Stand Stem & Base -->
  <path d="M 234 336 L 228 392 L 284 392 L 278 336 Z" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <rect x="178" y="390" width="156" height="14" rx="7" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>

  <!-- Desktop Monitor Outer Bezel -->
  <rect x="76" y="82" width="360" height="258" rx="24" fill="#111827" stroke="#334155" stroke-width="4"/>

  <!-- Window Header Bar with Traffic Lights -->
  <rect x="80" y="86" width="352" height="38" rx="20" fill="#1E2436"/>
  <circle cx="106" cy="105" r="5.5" fill="#EF4444"/>
  <circle cx="124" cy="105" r="5.5" fill="#F59E0B"/>
  <circle cx="142" cy="105" r="5.5" fill="#10B981"/>

  <!-- Title Pill -->
  <rect x="180" y="96" width="152" height="18" rx="9" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="256" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5">SSH DESKTOP</text>

  <!-- Inner Terminal Screen -->
  <rect x="90" y="128" width="332" height="198" rx="14" fill="url(#screenGradient)" stroke="#1E293B" stroke-width="2"/>

  <!-- Terminal Command Prompt: ">_ ssh" -->
  <!-- Prompt Chevron ">" -->
  <path d="M 118 162 L 142 182 L 118 202" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)"/>

  <!-- "ssh" Monospace text -->
  <text x="160" y="193" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="2">ssh</text>

  <!-- Flashing Cursor "_" -->
  <line x1="244" y1="193" x2="268" y2="193" stroke="#34D399" stroke-width="6" stroke-linecap="round" filter="url(#subtleGlow)"/>

  <!-- Secure SSH Key Emblem in screen right -->
  <g transform="translate(356, 185)">
    <!-- Glowing Security Ring -->
    <circle cx="0" cy="0" r="28" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3"/>
    <!-- Key Head Circle -->
    <circle cx="-5" cy="-5" r="9" fill="none" stroke="#38BDF8" stroke-width="3.5"/>
    <circle cx="-5" cy="-5" r="3.5" fill="#38BDF8"/>
    <!-- Key Shaft & Teeth -->
    <path d="M 2 2 L 15 15 L 12 18 M 11 11 L 15 15" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Status / Host detail line inside terminal -->
  <circle cx="122" cy="242" r="3.5" fill="#34D399" filter="url(#subtleGlow)"/>
  <text x="134" y="246" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#34D399">connected: port 22</text>
  <text x="120" y="274" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="500" fill="#64748B">remote: linux-x86_64 [ssh2]</text>
  <text x="120" y="296" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="500" fill="#64748B">security: e2e encrypted session</text>
</svg>
