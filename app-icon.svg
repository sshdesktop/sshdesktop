<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89B4FA"/>
      <stop offset="100%" stop-color="#CBA6F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle (macOS squircle style) -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bg)" stroke="#313244" stroke-width="4"/>

  <!-- Inner subtle border -->
  <rect x="40" y="40" width="432" height="432" rx="92" ry="92" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Cloud outline / icon -->
  <path d="M 330 350 L 195 350 C 153.5 350 120 316.5 120 275 C 120 236.8 148.6 205.2 185.7 200.8 C 196.4 154.6 237.6 120 286.5 120 C 342.3 120 388.1 161.4 394.3 216.5 C 427.6 226.7 452 257.6 452 294.5 C 452 336 418.5 369.5 377 369.5" 
        fill="none" 
        stroke="url(#accent)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Terminal prompt inside cloud -->
  <path d="M 210 260 L 255 295 L 210 330" fill="none" stroke="#A6E3A1" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="280" y1="330" x2="330" y2="330" stroke="#F9E2AF" stroke-width="20" stroke-linecap="round"/>
</svg>
