name: SSH Desktop CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (Node, Frontend, Rust)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Backend syntax, contract & integration tests
        run: |
          node --check server.js
          npm test

      - name: Frontend lint, typecheck & build
        run: |
          npm run lint
          npx tsc --noEmit
          npm run build

      - name: Rust unit & integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Generate SBOM, vulnerability & signed checksum artifacts
        run: |
          npm ls --json --all > sbom-npm-tree.json || true
          npm audit --omit=dev --json > vuln-npm-audit.json || true
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > sbom-cargo-metadata.json
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > SHA256SUMS.txt

      - name: Upload SBOM & verification inventory
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-verification-inventory
          path: |
            sbom-npm-tree.json
            vuln-npm-audit.json
            sbom-cargo-metadata.json
            SHA256SUMS.txt
          retention-days: 30
