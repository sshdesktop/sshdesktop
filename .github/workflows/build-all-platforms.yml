name: Release Build All Platforms

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Create draft release instead of published'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark release as pre-release'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os_name: 'Windows'
            args: ''
            artifact_name: 'CloudDesk-Windows-x64'
          - platform: 'ubuntu-22.04'
            os_name: 'Linux'
            args: '--bundles deb,appimage'
            artifact_name: 'CloudDesk-Linux-x64'
          - platform: 'macos-latest'
            os_name: 'macOS'
            args: '--target universal-apple-darwin'
            artifact_name: 'CloudDesk-macOS-Universal'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux-specific system dependencies for Tauri 2 + Package generation (.deb, .rpm, .tar.gz)
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm \
            dpkg-dev \
            binutils \
            tar \
            curl

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build web frontend
        run: npm run build

      # Generate standalone Linux packages (.deb, .rpm, .tar.gz) with Port 2222 web desktop
      - name: Build standalone Linux server packages (.deb, .rpm, .tar.gz)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          chmod +x scripts/build-linux-packages.sh
          ./scripts/build-linux-packages.sh

      # Build native desktop application via official Tauri Action
      - name: Build Tauri desktop bundle
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', '2.4.0') }}
          releaseName: 'CloudDesk v__VERSION__'
          releaseBody: |
            ## 🚀 CloudDesk v__VERSION__ Production Release
            
            Multi-platform macOS-inspired desktop environment & Linux server administration system.
            
            ### 📦 Platform Downloads:
            - **Windows**: `.msi` and `.exe` (NSIS Installer)
            - **Linux Desktop & Server**: `.deb` (Debian/Ubuntu), `.rpm` (AlmaLinux/Fedora/RHEL), `.AppImage`, and `.tar.gz`
            - **macOS**: Universal Binary `.dmg` (Apple Silicon M1/M2/M3 & Intel)
            
            ### 🌐 Web Desktop Server:
            - Runs on **Port 2222** with authentication gate (`admin` / `clouddesk`).
            - All remote SSH client connections strictly default to **Port 22**.
          releaseDraft: ${{ github.event.inputs.release_draft == 'true' || (!startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch') }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          args: ${{ matrix.args }}

      # Generate SHA-256 Checksums for all built packages
      - name: Generate Checksums (Linux / macOS)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p release-artifacts
          find src-tauri/target -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.tar.gz" \) -exec cp {} release-artifacts/ \; 2>/dev/null || true
          if [ -d "dist-packages" ]; then
            cp dist-packages/* release-artifacts/ 2>/dev/null || true
          fi
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          ls -la

      - name: Generate Checksums (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Get-ChildItem -Path src-tauri\target -Recurse -Include *.exe,*.msi,*.zip | ForEach-Object {
            Copy-Item $_.FullName -Destination release-artifacts/
          }
          Get-ChildItem -Path release-artifacts | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -FilePath release-artifacts/SHA256SUMS.txt -Append -Encoding ascii
          }
          Get-ChildItem release-artifacts

      # Upload artifacts to GitHub Actions run summary (always available even without release)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts/
          if-no-files-found: warn
          retention-days: 30
