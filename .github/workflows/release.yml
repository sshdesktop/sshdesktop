name: SSH Desktop - Multi-Platform Installer Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:

  # ==========================================
  # 1. DESKTOP INSTALLER BUILDS
  # ==========================================

  desktop:

    name: Build - ${{ matrix.platform }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # Windows x64
          - platform: windows-x64
            os: windows-latest
            bundles: nsis,msi

          # Linux x64
          - platform: linux-x64
            os: ubuntu-22.04
            bundles: deb,rpm

          # macOS Apple Silicon ARM64
          - platform: macos-arm64
            os: macos-15
            bundles: dmg

          # macOS Intel x64
          - platform: macos-x64
            os: macos-15-intel
            bundles: dmg

    steps:

      # --------------------------------------
      # Checkout
      # --------------------------------------

      - name: Checkout Source Code
        uses: actions/checkout@v4

      # --------------------------------------
      # Linux Dependencies
      # --------------------------------------

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            rpm \
            dpkg-dev

      # --------------------------------------
      # Node.js
      # --------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # --------------------------------------
      # Rust
      # --------------------------------------

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # --------------------------------------
      # Rust Cache
      # --------------------------------------

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # --------------------------------------
      # Frontend Dependencies
      # --------------------------------------

      - name: Install Frontend Dependencies
        run: npm ci

      # --------------------------------------
      # Build Desktop Installer
      # --------------------------------------

      - name: Build Tauri Installers
        run: npx tauri build --bundles "${{ matrix.bundles }}"

      # --------------------------------------
      # Collect Individual Installers
      # --------------------------------------

      - name: Collect Installer Files
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="src-tauri/target/release/bundle"

          mkdir -p build-output

          copy_one() {

            local pattern="$1"
            local output="$2"

            mapfile -t matches < <(
              find "$BUNDLE" -type f -iname "$pattern"
            )

            if [ "${#matches[@]}" -ne 1 ]; then

              echo "ERROR: Expected exactly one $pattern"

              printf '%s\n' "${matches[@]}"

              exit 1

            fi

            cp "${matches[0]}" "build-output/$output"

            echo "Created: $output"
          }

          case "${{ matrix.platform }}" in

            windows-x64)

              copy_one "*.exe" \
                "SSH-Desktop-Windows-x64-Setup.exe"

              copy_one "*.msi" \
                "SSH-Desktop-Windows-x64.msi"

              ;;

            linux-x64)

              copy_one "*.deb" \
                "SSH-Desktop-Linux-x64.deb"

              copy_one "*.rpm" \
                "SSH-Desktop-Linux-x64.rpm"

              ;;

            macos-arm64)

              copy_one "*.dmg" \
                "SSH-Desktop-macOS-arm64.dmg"

              ;;

            macos-x64)

              copy_one "*.dmg" \
                "SSH-Desktop-macOS-x64.dmg"

              ;;

            *)

              echo "Unsupported platform"

              exit 1

              ;;

          esac

          echo ""
          echo "========== INSTALLER FILES =========="

          ls -lh build-output/

          test -n "$(find build-output -type f -print -quit)"

      # --------------------------------------
      # Upload Installers
      # --------------------------------------

      - name: Upload Platform Installers
        uses: actions/upload-artifact@v4

        with:
          name: sshdesktop-${{ matrix.platform }}

          path: build-output/*

          if-no-files-found: error

          retention-days: 14


  # ==========================================
  # 2. PUBLISH GITHUB RELEASE
  # ==========================================

  release:

    name: Publish Official GitHub Release

    needs:
      - desktop

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # --------------------------------------
      # Checkout
      # --------------------------------------

      - name: Checkout Source Code
        uses: actions/checkout@v4

      # --------------------------------------
      # Download All Installers
      # --------------------------------------

      - name: Download All Platform Installers
        uses: actions/download-artifact@v4

        with:
          path: all-artifacts

      # --------------------------------------
      # Prepare Release Files
      # --------------------------------------

      - name: Prepare Individual Release Files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-files

          echo "Collecting Windows installers..."

          cp all-artifacts/sshdesktop-windows-x64/* \
            release-files/

          echo "Collecting Linux installers..."

          cp all-artifacts/sshdesktop-linux-x64/* \
            release-files/

          echo "Collecting macOS ARM64 installer..."

          cp all-artifacts/sshdesktop-macos-arm64/* \
            release-files/

          echo "Collecting macOS Intel installer..."

          cp all-artifacts/sshdesktop-macos-x64/* \
            release-files/

          cd release-files

          # ----------------------------------
          # Validate Every Installer
          # ----------------------------------

          expected_files=(

            "SSH-Desktop-Windows-x64-Setup.exe"

            "SSH-Desktop-Windows-x64.msi"

            "SSH-Desktop-Linux-x64.deb"

            "SSH-Desktop-Linux-x64.rpm"

            "SSH-Desktop-macOS-arm64.dmg"

            "SSH-Desktop-macOS-x64.dmg"

          )

          for file in "${expected_files[@]}"; do

            if [ ! -s "$file" ]; then

              echo "Missing installer: $file"

              exit 1

            fi

          done

          # ----------------------------------
          # Generate SHA256 Checksums
          # ----------------------------------

          sha256sum "${expected_files[@]}" > SHA256SUMS.txt

          # ----------------------------------
          # Final Output
          # ----------------------------------

          echo ""
          echo "=================================="
          echo "SSH DESKTOP PRODUCTION INSTALLERS"
          echo "=================================="

          ls -lh

          echo ""
          echo "SHA256 CHECKSUMS"

          cat SHA256SUMS.txt

      # --------------------------------------
      # Publish Official Release
      # --------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          name: SSH Desktop ${{ github.ref_name }}

          tag_name: ${{ github.ref_name }}

          files: |
            release-files/SSH-Desktop-Windows-x64-Setup.exe
            release-files/SSH-Desktop-Windows-x64.msi
            release-files/SSH-Desktop-Linux-x64.deb
            release-files/SSH-Desktop-Linux-x64.rpm
            release-files/SSH-Desktop-macOS-arm64.dmg
            release-files/SSH-Desktop-macOS-x64.dmg
            release-files/SHA256SUMS.txt

          draft: false

          prerelease: false

          generate_release_notes: true

          fail_on_unmatched_files: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
