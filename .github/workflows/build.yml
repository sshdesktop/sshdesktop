name: SSH Desktop - Multi-Platform Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: windows-installer

          - platform: linux
            os: ubuntu-22.04
            artifact: linux-installer

          - platform: macos
            os: macos-latest
            artifact: macos-installer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev patchelf \
            libfuse2 librsvg2-common rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build

      - name: Locate Build Artifacts
        shell: bash
        run: |
          echo "=== Target Directory Listing ==="
          ls -la target/release/ 2>/dev/null || echo "target/release not found"
          ls -la target/release/bundle/ 2>/dev/null || echo "target/release/bundle not found"
          ls -la src-tauri/target/release/ 2>/dev/null || echo "src-tauri/target/release not found"
          ls -la src-tauri/target/release/bundle/ 2>/dev/null || echo "src-tauri/target/release/bundle not found"

      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/ssh-desktop.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/ssh-desktop.exe
          if-no-files-found: warn

      - name: Upload Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/ssh-desktop
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/ssh-desktop
          if-no-files-found: warn

      - name: Upload macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/ssh-desktop
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/ssh-desktop
          if-no-files-found: warn

      - name: Upload Standalone Executable Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-standalone-binary
          path: |
            target/release/ssh-desktop.exe
            target/release/ssh-desktop
            src-tauri/target/release/ssh-desktop.exe
            src-tauri/target/release/ssh-desktop
          if-no-files-found: warn

  linux-self-installer:
    name: Build Self-Installing Linux Server
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web frontend
        run: npm run build

      - name: Check server syntax
        run: node --check server.js

      - name: Create self-installing package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package/ssh-server

          cp server.js package/ssh-server/
          cp package.json package/ssh-server/
          cp package-lock.json package/ssh-server/
          cp -r dist package/ssh-server/dist

          # Pre-bundle production backend dependencies so the package is 100% self-contained
          cd package/ssh-server
          npm ci --omit=dev
          cd ../..

          # Direct 1-click launcher: Just run this script to start frontend + backend
          cat > package/start.sh <<'STARTER'
          #!/usr/bin/env bash
          # =====================================================================
          # SSH Desktop - Frontend & Node.js Backend All-in-One Runner
          # Just run: ./start.sh (or PORT=2222 ./start.sh)
          # =====================================================================
          set -e
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$DIR/ssh-server"
          export PORT="${PORT:-2222}"
          export HOST="${HOST:-0.0.0.0}"
          echo "================================================================"
          echo "🚀 SSH Desktop All-in-One Engine Starting..."
          echo "📡 URL: http://${HOST}:${PORT}"
          echo "🔑 Default Login: admin / sshdesktop"
          echo "================================================================"
          exec node server.js
          STARTER

          chmod +x package/start.sh
          cp package/start.sh package/run.sh

          # System-level 24/7 service installer
          cat > package/install.sh <<'INSTALLER'
          #!/usr/bin/env bash
          set -euo pipefail

          if [ "$(id -u)" -ne 0 ]; then
            echo "Run: sudo bash install.sh"
            exit 1
          fi

          export DEBIAN_FRONTEND=noninteractive

          if ! command -v node >/dev/null 2>&1 ||
             ! node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 20 ? 0 : 1)'; then
            apt-get update
            apt-get install -y ca-certificates curl
            curl -fsSL https://deb.nodesource.com/setup_22.x -o /tmp/nodesource_setup.sh
            bash /tmp/nodesource_setup.sh
            apt-get install -y nodejs
          fi

          install -d -m 755 /opt/ssh-server
          cp -r "$(dirname "$0")/ssh-server/." /opt/ssh-server/

          if ! id sshapp >/dev/null 2>&1; then
            useradd --system --home /opt/ssh-server --shell /usr/sbin/nologin sshapp 2>/dev/null || true
          fi

          chown -R root:root /opt/ssh-server
          chmod -R go-w /opt/ssh-server

          cat > /etc/systemd/system/ssh-server.service <<'UNIT'
          [Unit]
          Description=SSH Desktop All-in-One Web Server & SSH Backend
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/ssh-server
          Environment=NODE_ENV=production
          Environment=PORT=2222
          Environment=HOST=0.0.0.0
          ExecStart=/usr/bin/node /opt/ssh-server/server.js
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable --now ssh-server
          systemctl --no-pager --full status ssh-server || true

          echo "================================================================"
          echo "🎉 SSH Desktop Installed & Running Successfully!"
          echo "📡 Access at: http://<YOUR_SERVER_IP>:2222"
          echo "🔑 Default Login: admin / sshdesktop"
          echo "📜 View Logs: journalctl -u ssh-server -f"
          echo "================================================================"
          INSTALLER

          chmod +x package/install.sh

          cat > package/README.txt <<'INFO'
          ================================================================
          SSH Desktop - Complete Standalone Application (Frontend + Backend)
          ================================================================

          This package contains both the React frontend and the Node.js SSH2 backend.

          Option 1: Quick Run (No root required)
            ./start.sh
            (Or: ./run.sh)

          Option 2: Install as 24/7 Systemd Service (Requires root/sudo)
            sudo bash install.sh

          Default Port: 2222
          Default Login: admin / sshdesktop
          INFO

          tar -czf ssh-linux-self-installer.tar.gz -C package .

      - name: Upload self-installing package
        uses: actions/upload-artifact@v4
        with:
          name: linux-self-installer
          path: ssh-linux-self-installer.tar.gz
          if-no-files-found: error
