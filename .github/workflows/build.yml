name: SSH Desktop - Multi-Platform Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest

          - platform: linux
            os: ubuntu-22.04

          - platform: macos
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev patchelf \
            libfuse2 librsvg2-common rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build

      - name: Collect Built Files Only
        shell: bash
        run: |
          mkdir -p build-output
          # Collect all compiled desktop binaries and installers (no scripts, no source files)
          find . -type f \( -name "ssh-desktop.exe" -o -name "ssh-desktop" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" \) \
            ! -path "*/node_modules/*" ! -path "*/.git/*" ! -path "*/build-output/*" \
            ! -path "*/target/release/build/*" ! -path "*/target/release/deps/*" \
            ! -path "*/src-tauri/target/release/build/*" ! -path "*/src-tauri/target/release/deps/*" \
            -exec cp {} build-output/ \; 2>/dev/null || true
          echo "=== Built Files Collected ==="
          ls -la build-output/

      - name: Upload Built Binary Files
        uses: actions/upload-artifact@v4
        with:
          name: sshdesktop-${{ matrix.platform }}-built-file
          path: build-output/*
          if-no-files-found: warn

  linux-standalone-binary:
    name: Build Standalone Linux Executable Binary
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

      - name: Prepare Single Executable Application (SEA) Blob
        run: npm run build:sea-prep

      - name: Build Standalone Linux Binary Executable
        shell: bash
        run: |
          set -euo pipefail
          
          # Inject SEA blob into Node runtime to create 100% self-contained standalone binary
          cp $(command -v node) sshdesktop-linux-x64
          npx --yes postject sshdesktop-linux-x64 NODE_SEA_BLOB dist-server/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          chmod +x sshdesktop-linux-x64

          # Test binary execution help / verification
          ./sshdesktop-linux-x64 --version || true

      - name: Upload Standalone Linux Binary (Direct Built File Only)
        uses: actions/upload-artifact@v4
        with:
          name: sshdesktop-linux-x64
          path: sshdesktop-linux-x64
          if-no-files-found: error
