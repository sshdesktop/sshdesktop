name: SSH Desktop - Multi-Platform Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: windows-installer

          - platform: linux
            os: ubuntu-22.04
            artifact: linux-installer

          - platform: macos
            os: macos-latest
            artifact: macos-installer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev patchelf \
            libfuse2 librsvg2-common rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build

      - name: Locate Build Artifacts
        shell: bash
        run: |
          echo "=== Target Directory Listing ==="
          ls -la target/release/ 2>/dev/null || echo "target/release not found"
          ls -la target/release/bundle/ 2>/dev/null || echo "target/release/bundle not found"
          ls -la src-tauri/target/release/ 2>/dev/null || echo "src-tauri/target/release not found"
          ls -la src-tauri/target/release/bundle/ 2>/dev/null || echo "src-tauri/target/release/bundle not found"

      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/ssh-desktop.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/ssh-desktop.exe
          if-no-files-found: warn

      - name: Upload Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/ssh-desktop
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/ssh-desktop
          if-no-files-found: warn

      - name: Upload macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/ssh-desktop
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/ssh-desktop
          if-no-files-found: warn

      - name: Upload Standalone Executable Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-standalone-binary
          path: |
            target/release/ssh-desktop.exe
            target/release/ssh-desktop
            src-tauri/target/release/ssh-desktop.exe
            src-tauri/target/release/ssh-desktop
          if-no-files-found: warn

  linux-standalone-binary:
    name: Build Standalone Linux Executable Binary (Dual Engine 2222/2020)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

      - name: Verify server code
        run: node --check server.js

      - name: Prepare Single Executable Application (SEA) Blob
        run: npm run build:sea-prep

      - name: Build Standalone Linux Binary Executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-bin
          
          # Inject SEA blob into Node runtime to create 100% self-contained standalone binary
          cp $(command -v node) dist-bin/sshdesktop
          npx --yes postject dist-bin/sshdesktop NODE_SEA_BLOB dist-server/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          chmod +x dist-bin/sshdesktop
          cp dist-bin/sshdesktop dist-bin/sshdesktop-linux-x64
          
          # Include single service file and runner scripts
          cp scripts/sshdesktop.service dist-bin/
          cp install.sh dist-bin/
          cp start.sh dist-bin/

          # Test binary execution help / verification
          ./dist-bin/sshdesktop --version || true

      - name: Upload Single Standalone Linux Binary (Direct Executable)
        uses: actions/upload-artifact@v4
        with:
          name: sshdesktop-linux-x64
          path: dist-bin/sshdesktop-linux-x64
          if-no-files-found: error

      - name: Upload Standalone Linux Bundle (Binary + Service + Installer)
        uses: actions/upload-artifact@v4
        with:
          name: sshdesktop-linux-complete-bundle
          path: dist-bin/*
          if-no-files-found: error
