name: SSH Desktop - Multi-Platform Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: windows-installer

          - platform: linux
            os: ubuntu-22.04
            artifact: linux-installer

          - platform: macos
            os: macos-latest
            artifact: macos-installer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev patchelf \
            libfuse2 librsvg2-common rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build

      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  linux-self-installer:
    name: Build Self-Installing Linux Server
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web frontend
        run: npm run build

      - name: Check server syntax
        run: node --check server.js

      - name: Create self-installing package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package/ssh-server

          cp server.js package/ssh-server/
          cp package.json package/ssh-server/
          cp package-lock.json package/ssh-server/
          cp -r dist package/ssh-server/dist

          cat > package/install.sh <<'INSTALLER'
          #!/usr/bin/env bash
          set -euo pipefail

          if [ "$(id -u)" -ne 0 ]; then
            echo "Run: sudo bash install.sh"
            exit 1
          fi

          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y ca-certificates curl

          if ! command -v node >/dev/null 2>&1 ||
             ! node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 22 ? 0 : 1)'; then
            curl -fsSL https://deb.nodesource.com/setup_22.x \
              -o /tmp/nodesource_setup.sh
            bash /tmp/nodesource_setup.sh
            apt-get install -y nodejs
          fi

          install -d -m 755 /opt/ssh-server
          cp -r "$(dirname "$0")/ssh-server/." /opt/ssh-server/
          cd /opt/ssh-server
          npm ci --omit=dev

          if ! id sshapp >/dev/null 2>&1; then
            useradd --system --home /opt/ssh-server \
              --shell /usr/sbin/nologin sshapp
          fi

          chown -R root:root /opt/ssh-server
          chmod -R go-w /opt/ssh-server

          cat > /etc/systemd/system/ssh-server.service <<'UNIT'
          [Unit]
          Description=SSH Application Node.js Web Server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=sshapp
          Group=sshapp
          WorkingDirectory=/opt/ssh-server
          Environment=NODE_ENV=production
          Environment=PORT=2222
          ExecStart=/usr/bin/node /opt/ssh-server/server.js
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable --now ssh-server
          systemctl --no-pager --full status ssh-server

          echo "Installation completed."
          echo "Check logs: journalctl -u ssh-server -f"
          INSTALLER

          chmod +x package/install.sh

          cat > package/README.txt <<'INFO'
          SSH Server Installer

          Supported target: Ubuntu/Debian Linux
          Required access: root/sudo and internet connectivity

          Extract the archive and run:
            sudo bash install.sh

          The installer installs Node.js 22 if needed,
          installs production dependencies, configures systemd,
          and starts the server.

          Your server.js must listen on process.env.PORT (2222).
          Configure your firewall separately to permit TCP 2222.
          INFO

          tar -czf ssh-linux-self-installer.tar.gz -C package .

      - name: Upload self-installing package
        uses: actions/upload-artifact@v4
        with:
          name: linux-self-installer
          path: ssh-linux-self-installer.tar.gz
          if-no-files-found: error
