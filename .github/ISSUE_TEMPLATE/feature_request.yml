name: 💡 Feature Request
description: Propose a new feature or improvement for SSH Desktop
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love new ideas! Check existing open issues to avoid submitting duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or workflow bottleneck is.
      placeholder: "I am always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution or Feature
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you've evaluated.
    validations:
      required: false
  - type: dropdown
    id: target_subsystem
    attributes:
      label: Target Application Subsystem
      description: Which area does this feature impact?
      options:
        - SSH Connectivity & Tunnels
        - Terminal / PTY
        - File Manager / SFTP
        - Docker & Container Management
        - Database Studios
        - Security, Audit & Authentication
        - System Management (Disk, Services, Firewall, Users)
        - Web Mode & Browser Gateway
        - Other
    validations:
      required: true
